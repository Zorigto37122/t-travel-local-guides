name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── CI: проверяем что всё собирается ──────────────────────────────────────
  ci:
    name: Build & Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build ./backend -t t-travel-backend

      - name: Build frontend image
        run: docker build ./frontend --target dev -t t-travel-frontend

  # ── CD: деплой на сервер ──────────────────────────────────────────────────
  # Раскомментируй когда появится VPS.
  # Нужно добавить в Settings → Secrets:
  #   SERVER_HOST  — IP сервера
  #   SERVER_USER  — пользователь (обычно root или ubuntu)
  #   SERVER_SSH_KEY — приватный SSH ключ

